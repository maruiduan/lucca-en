name: Deploy to OSS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Secrets are empty strings when unset, and the secrets context is
      # rejected in if:. Pass them only as env and test before any heavy step.
      - name: Check OSS secrets
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          fail=0
          if ! test -n "$OSS_ACCESS_KEY_ID"; then
            echo "::error title=Missing OSS secret::OSS_ACCESS_KEY_ID is empty. Set this repository Actions secret before deploy."
            fail=1
          fi
          if ! test -n "$OSS_ACCESS_KEY_SECRET"; then
            echo "::error title=Missing OSS secret::OSS_ACCESS_KEY_SECRET is empty. Set this repository Actions secret before deploy."
            fail=1
          fi
          if test "$fail" -ne 0; then
            echo "Refusing to install, stamp, or upload until both OSS secrets are set."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check OSS security headers
        run: python3 scripts/upload_oss.py --check
      - name: Install deps
        run: python3 -m pip install -r requirements.txt
      - name: Stamp site → dist
        run: python3 scripts/stamp_static.py site dist
      - name: Upload dist to lucca-en
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com
        run: python3 scripts/upload_oss.py dist lucca-en
